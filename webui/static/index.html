<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stadia Controller Console</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="title">Stadia Controller Console</h1>
    <div class="receiver">
      <span id="phase" class="badge wait" data-i18n="phase.unknown">Checking…</span>
      <span id="receiver-info" class="muted"></span>
      <button id="btn-start" type="button" disabled data-i18n="btn.start">Start stadiacast</button>
      <button id="btn-stop" type="button" class="secondary" disabled data-i18n="btn.stop">Stop</button>
      <div class="lang" role="group" aria-label="Language / 语言">
        <button type="button" class="lang-btn" data-lang="zh" lang="zh-CN" aria-pressed="false">中文</button>
        <button type="button" class="lang-btn" data-lang="en" lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main>
    <p class="hint muted" data-i18n="hint"></p>

    <section id="controllers" class="grid" data-i18n-aria="controllers.label"></section>

    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="events.title"></h2>
        <span id="log-path" class="muted small"></span>
      </div>
      <div class="table-wrap">
        <table id="events">
          <thead><tr>
            <th data-i18n="events.time"></th><th data-i18n="events.controller"></th>
            <th data-i18n="events.event"></th><th data-i18n="events.detail"></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <details class="panel" id="settings">
      <summary><h2 data-i18n="settings.title"></h2></summary>
      <form id="settings-form" novalidate>
        <label class="field"><span data-i18n="settings.dns"></span>
          <input name="dns_upstream" autocomplete="off" spellcheck="false">
        </label>
        <table class="ctl-table">
          <thead><tr>
            <th data-i18n="settings.name"></th><th data-i18n="settings.ip"></th><th data-i18n="settings.note"></th><th></th>
          </tr></thead>
          <tbody id="ctl-rows"></tbody>
        </table>
        <div class="row">
          <button type="button" id="btn-add" class="secondary" data-i18n="settings.add"></button>
          <button type="submit" data-i18n="settings.save"></button>
          <span id="settings-msg" class="muted"></span>
        </div>
        <p class="muted small">
          <span data-i18n="settings.help1"></span>
          <span data-i18n="settings.help2"></span>
        </p>
      </form>
    </details>
  </main>

  <template id="card-template">
    <article class="card">
      <header class="card-head">
        <h2 class="name"></h2>
        <span class="note muted"></span>
        <span class="badge link"></span>
      </header>
      <dl class="facts">
        <div><dt data-i18n="card.ip"></dt><dd class="ip"></dd></div>
        <div><dt data-i18n="card.label"></dt><dd class="label"></dd></div>
        <div><dt data-i18n="card.player"></dt><dd class="player"></dd></div>
        <div><dt data-i18n="card.battery"></dt><dd><span class="battery"><span class="battery-fill"></span></span> <span class="battery-text"></span><span class="battery-when muted small"></span></dd></div>
        <div><dt data-i18n="card.seen"></dt><dd class="seen"></dd></div>
      </dl>
      <div class="pad">
        <div class="shoulders">
          <div class="trigger"><span>L2</span><span class="bar"><span class="fill l2"></span></span></div>
          <span class="chip" data-btn="l1">L1</span>
          <span class="chip" data-btn="r1">R1</span>
          <div class="trigger"><span class="bar"><span class="fill r2"></span></span><span>R2</span></div>
        </div>
        <div class="pad-body">
          <div class="dpad">
            <span class="chip up" data-btn="dpad_up" data-i18n="btn.up"></span>
            <span class="chip left" data-btn="dpad_left" data-i18n="btn.left"></span>
            <span class="chip right" data-btn="dpad_right" data-i18n="btn.right"></span>
            <span class="chip down" data-btn="dpad_down" data-i18n="btn.down"></span>
          </div>
          <div class="stick" data-btn="l3"><span class="dot ls"></span></div>
          <div class="middle">
            <span class="chip small" data-btn="options" data-i18n-title="btn.optionsTitle">⋯</span>
            <span class="chip small" data-btn="menu" data-i18n-title="btn.menuTitle">≡</span>
            <span class="chip small" data-btn="assistant" data-i18n="btn.assistant" data-i18n-title="btn.assistantTitle"></span>
            <span class="chip small" data-btn="capture" data-i18n="btn.capture" data-i18n-title="btn.captureTitle"></span>
            <span class="chip wide" data-btn="stadia" data-i18n-title="btn.stadiaTitle">Stadia</span>
          </div>
          <div class="stick" data-btn="r3"><span class="dot rs"></span></div>
          <div class="face">
            <span class="chip y" data-btn="y">Y</span>
            <span class="chip x" data-btn="x">X</span>
            <span class="chip b" data-btn="b">B</span>
            <span class="chip a" data-btn="a">A</span>
          </div>
        </div>
      </div>
      <div class="rumble">
        <label><span data-i18n="rumble.strength"></span> <input type="range" class="strength" min="5000" max="65535" step="1000" value="40000"></label>
        <select class="duration" data-i18n-aria="rumble.duration">
          <option value="300" data-i18n="rumble.s03"></option>
          <option value="1000" selected data-i18n="rumble.s1"></option>
          <option value="2000" data-i18n="rumble.s2"></option>
        </select>
        <button type="button" class="btn-rumble" data-i18n="rumble.button"></button>
        <span class="rumble-msg muted small"></span>
      </div>
    </article>
  </template>
</body>
</html>
